name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
        working-directory: packages/agentnorth

      - run: pnpm run build
        working-directory: packages/agentnorth

      - run: pnpm run test -- --run
        working-directory: packages/agentnorth
